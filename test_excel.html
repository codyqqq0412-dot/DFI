<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Excel 下載測試</title>
<style>
body { font-family: Arial; padding: 30px; background: #f0f4f8; }
.box { background: white; border-radius: 12px; padding: 24px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
h2 { color: #1a4f7a; margin-top: 0; }
button { padding: 12px 24px; background: #1a4f7a; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 8px 4px; }
button:hover { background: #0f2a45; }
.log { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px; margin-top: 16px; font-family: monospace; font-size: 13px; min-height: 80px; white-space: pre-wrap; }
.ok { color: green; font-weight: bold; }
.err { color: red; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h2>🔧 Excel 下載診斷工具</h2>
  <p>點以下按鈕，診斷你的瀏覽器能否下載 Excel：</p>

  <button onclick="test1()">① 測試 XLSX 函式庫是否載入</button><br>
  <button onclick="test2()">② 測試建立 Excel 檔案</button><br>
  <button onclick="test3()">③ 測試 Blob 下載</button><br>
  <button onclick="test4()">④ 完整下載測試（一次全做）</button>

  <div class="log" id="log">等待測試...</div>
</div>

<!-- 使用與 DFI 系統相同的 SheetJS CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
var log = document.getElementById('log');

function addLog(msg, type) {
  var span = document.createElement('span');
  span.className = type || '';
  span.textContent = msg + '\n';
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

function clearLog() {
  log.innerHTML = '';
}

function test1() {
  clearLog();
  addLog('【測試1】檢查 XLSX 函式庫...');
  if (typeof XLSX === 'undefined') {
    addLog('❌ XLSX 未定義！CDN 載入失敗。', 'err');
    addLog('→ 請檢查網路連線，或改用有內嵌 SheetJS 的版本。');
  } else {
    addLog('✅ XLSX 已載入，版本: ' + (XLSX.version || '未知'), 'ok');
    addLog('→ 函式庫正常！');
  }
}

function test2() {
  clearLog();
  addLog('【測試2】建立 Excel 工作表...');
  try {
    if (typeof XLSX === 'undefined') throw new Error('XLSX 未載入');
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet([
      ['姓名', '金額', '日期'],
      ['測試客戶', 100000, new Date().toLocaleDateString()]
    ]);
    XLSX.utils.book_append_sheet(wb, ws, '測試');
    addLog('✅ 工作表建立成功！', 'ok');
    addLog('→ SheetJS 基本功能正常。');
    return wb;
  } catch(e) {
    addLog('❌ 錯誤: ' + e.message, 'err');
    return null;
  }
}

function test3() {
  clearLog();
  addLog('【測試3】測試 Blob 下載...');
  try {
    if (typeof Blob === 'undefined') throw new Error('瀏覽器不支援 Blob');
    if (typeof URL === 'undefined' || typeof URL.createObjectURL === 'undefined') throw new Error('瀏覽器不支援 URL.createObjectURL');

    var blob = new Blob(['測試內容'], {type: 'text/plain'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'test.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
    addLog('✅ Blob 下載觸發成功！', 'ok');
    addLog('→ 請確認瀏覽器是否有下載 test.txt');
  } catch(e) {
    addLog('❌ 錯誤: ' + e.message, 'err');
  }
}

function test4() {
  clearLog();
  addLog('【完整測試】開始...\n');

  // Step 1
  addLog('步驟1: 檢查 XLSX...');
  if (typeof XLSX === 'undefined') {
    addLog('❌ XLSX 未載入！CDN 可能被封鎖。', 'err');
    addLog('\n→ 解決方法：使用含內嵌 SheetJS 的版本（檔案較大但不需要 CDN）');
    return;
  }
  addLog('✅ XLSX v' + (XLSX.version||'?'), 'ok');

  // Step 2
  addLog('\n步驟2: 建立試算表...');
  try {
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet([
      ['DFI 測試報表'],
      ['日期', '客戶', '金額'],
      [new Date().toLocaleDateString(), '測試客戶 ABC', 1500000]
    ]);
    ws['!cols'] = [{wch:15},{wch:20},{wch:15}];
    XLSX.utils.book_append_sheet(wb, ws, '報表');
    addLog('✅ 試算表建立成功', 'ok');

    // Step 3
    addLog('\n步驟3: 產生 Excel 二進位...');
    var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    addLog('✅ 產生成功，大小: ' + wbout.length + ' bytes', 'ok');

    // Step 4
    addLog('\n步驟4: 建立 Blob 並下載...');
    var blob = new Blob([wbout], {type:'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'DFI_測試_' + Date.now() + '.xlsx';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try { document.body.removeChild(a); } catch(e){}
      URL.revokeObjectURL(url);
    }, 2000);
    addLog('✅ 下載已觸發！', 'ok');
    addLog('\n→ 請確認瀏覽器有沒有下載到 .xlsx 檔案');
    addLog('→ 如果有下載，表示 Excel 功能正常，問題在 DFI 系統本身');
    addLog('→ 如果沒有下載，問題在瀏覽器設定或 CDN 被封鎖');

  } catch(e) {
    addLog('❌ 錯誤: ' + e.message, 'err');
    addLog('錯誤詳情: ' + e.stack);
  }
}

// 頁面載入時自動執行測試1
window.onload = function() { test1(); };
</script>
</body>
</html>
